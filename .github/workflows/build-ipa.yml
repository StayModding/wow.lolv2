name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: xcodebuild (no signing)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build WowTok.app
        run: |
          set -o pipefail
          xcodebuild \
            -project WowTok.xcodeproj \
            -scheme WowTok \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build | tee build.log

      - name: Package Payload into an unsigned .ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/WowTok.app"
          if [ ! -d "$APP" ]; then
            echo "::error::No WowTok.app produced. Last 80 lines of the build log:"
            tail -n 80 build.log
            exit 1
          fi
          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry WowTok-unsigned.ipa Payload
          unzip -l WowTok-unsigned.ipa | head -n 20
          echo "IPA size: $(du -h WowTok-unsigned.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WowTok-unsigned-ipa
          path: out/WowTok-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
