name: Release IPA

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and attach IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project WowIos.xcodeproj \
            -scheme WowIos \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Package Payload
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/WowIos.app"
          test -d "$APP" || { tail -n 80 build.log; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry wow-ios-unsigned.ipa Payload
          du -h wow-ios-unsigned.ipa

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: out/wow-ios-unsigned.ipa
          fail_on_unmatched_files: true
          body: |
            Unsigned build of wow-ios from `${{ github.sha }}`.

            Sign `wow-ios-unsigned.ipa` with your own certificate (dev VPN / sideload tool) before installing.
